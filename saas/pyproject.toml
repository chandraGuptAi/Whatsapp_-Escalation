[project]
name = "whatsapp-escalation"
version = "0.1.0"
description = "Multi-tenant WhatsApp escalation analysis platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3.0",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "redis>=5.0,<7",
    "PyJWT>=2.8,<3",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "croniter>=2.0",
    "httpx>=0.27",
    "openai>=1.40",
    "openpyxl>=3.1,<4",
    "reportlab>=4.2",
]

[project.optional-dependencies]
whatsapp = ["neonize==0.5.2", "segno>=1.6"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests", "app/modules"]
pythonpath = ["."]
